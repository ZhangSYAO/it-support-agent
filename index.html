<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT 服务台助手</title>

  <style>
    * { box-sizing: border-box; }


    select {
  flex: 1;
  min-width: 0;
  padding: 12px;
  border: 1px solid #ccd4e0;
  border-radius: 8px;
  background: white;
  font: inherit;
}

    body {
      margin: 0;
      background: #f3f5f9;
      color: #243047;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .container {
      max-width: 960px;
      margin: 32px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      border: 1px solid #e0e5ee;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .header, .row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header { justify-content: space-between; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    h2 { font-size: 18px; margin-top: 0; }
    p { line-height: 1.6; }
    .muted { color: #68758a; font-size: 13px; }
    #session { overflow-wrap: anywhere; }

    #messages {
      height: 420px;
      overflow-y: auto;
      padding: 16px;
      margin: 18px 0;
      border-radius: 10px;
      background: #f7f9fc;
    }

    .message {
      max-width: 90%;
      padding: 12px 15px;
      margin-bottom: 14px;
      border-radius: 10px;
    }

    .message.user {
      margin-left: auto;
      background: #e4edff;
    }

    .message.assistant {
      background: white;
      border: 1px solid #e0e5ee;
    }

    .message.error { background: #fff0f0; }

    .role {
      font-size: 12px;
      color: #68758a;
      margin-bottom: 6px;
    }

    .content, pre {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      line-height: 1.7;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 12px;
      border: 1px solid #ccd4e0;
      border-radius: 8px;
      font: inherit;
    }

    button {
      padding: 11px 16px;
      border: none;
      border-radius: 8px;
      background: #285de5;
      color: white;
      cursor: pointer;
      font: inherit;
    }

    button.secondary {
      background: #edf1f8;
      color: #243047;
    }

    button:disabled { opacity: 0.5; cursor: wait; }

    pre {
      max-height: 360px;
      overflow-y: auto;
      padding: 12px;
      background: #f7f9fc;
      font-size: 13px;
    }

    summary { cursor: pointer; }
    label { display: block; margin-bottom: 10px; }

    @media (max-width: 600px) {
      .container { margin: 16px auto; }
      .card { padding: 14px; }
      .message { max-width: 100%; }
      #messages { height: 380px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <div class="header">
        <div>
          <h1>IT 服务台助手</h1>
          <div class="muted">设备排障 · 权限申请 · 网络问题 · 软件安装</div>
        </div>
        <button id="new-chat" class="secondary" type="button">
          新建会话
        </button>
      </div>

      <p id="session" class="muted">当前会话：尚未开始</p>

      <div id="messages" role="log" aria-live="polite"></div>

      <form id="chat-form" class="row">
        <input
          id="message-input"
          aria-label="输入 IT 问题"
          placeholder="例如：设备编号 PC-2026-001，电脑无法开机"
          maxlength="4000"
          autocomplete="off"
          required
        >
        <button id="send-button" type="submit">发送</button>
      </form>

      <p id="chat-status" class="muted" role="status">
        本地演示：工单只保存在本机，刷新页面会开始新会话。
      </p>
    </section>

    <section class="card">
      <details>
        <summary>查看最近一次请求的调试信息</summary>
        <pre id="debug-output">发送消息后显示 Agent、实体和工具调用记录。</pre>
      </details>
    </section>

    <section class="card">
      <h2>查询本地演示工单</h2>

      <form id="ticket-form">
        <label for="ticket-input">工单编号</label>
        <div class="row">
          <input
            id="ticket-input"
            placeholder="粘贴 DEMO- 开头的完整工单号"
            autocomplete="off"
            required
          >
          <button id="ticket-button" type="submit">查询</button>
        </div>
      </form>

      <pre id="ticket-output">查询结果会显示在这里。</pre>
        <hr>

<h2>更新演示工单状态</h2>
<p class="muted">
  使用上方填写的工单编号，仅用于本地演示。
</p>

<form id="status-form">
  <label for="status-select">目标状态</label>

  <div class="row">
    <select id="status-select">
      <option value="in_progress">处理中</option>
      <option value="resolved">已解决</option>
    </select>

    <button id="status-button" type="submit">
      更新状态
    </button>
  </div>
</form>

<pre id="status-output">尚未更新状态。</pre>
    </section>
  </main>

  <script>
    let conversationId = null;
    let sending = false;

    const messages = document.getElementById("messages");
    const messageInput = document.getElementById("message-input");
    const sendButton = document.getElementById("send-button");
    const newChatButton = document.getElementById("new-chat");
    const sessionLabel = document.getElementById("session");
    const chatStatus = document.getElementById("chat-status");
    const debugOutput = document.getElementById("debug-output");

    function addMessage(role, text, isError = false) {
      const item = document.createElement("div");
      item.className = "message " + role + (isError ? " error" : "");

      const label = document.createElement("div");
      label.className = "role";
      label.textContent = role === "user" ? "你" : "IT 助手";

      const content = document.createElement("div");
      content.className = "content";
      content.textContent = text;

      item.append(label, content);
      messages.appendChild(item);
      messages.scrollTop = messages.scrollHeight;
    }

    async function requestJson(url, options = {}) {
      const response = await fetch(url, options);
      const text = await response.text();

      let data;

      try {
        data = JSON.parse(text);
      } catch {
        throw new Error("服务没有返回有效 JSON，请检查后端终端。");
      }

      if (!response.ok) {
        const detail = data.detail || "请求失败";

        throw new Error(
          typeof detail === "string"
            ? detail
            : JSON.stringify(detail)
        );
      }

      return data;
    }

    function setSending(value) {
      sending = value;
      sendButton.disabled = value;
      newChatButton.disabled = value;
      messageInput.disabled = value;
      sendButton.textContent = value ? "处理中…" : "发送";
    }

    document.getElementById("chat-form").addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const message = messageInput.value.trim();

        if (!message || sending) return;

        addMessage("user", message);
        messageInput.value = "";
        setSending(true);
        chatStatus.textContent = "正在处理，请稍候…";

        try {
          const payload = { message };

          if (conversationId) {
            payload.conversation_id = conversationId;
          }

          const data = await requestJson("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          conversationId = data.conversation_id;
          sessionLabel.textContent = "当前会话：" + conversationId;

          addMessage("assistant", data.reply);

          debugOutput.textContent = JSON.stringify({
            conversation_id: data.conversation_id,
            intent: data.intent,
            agent: data.agent,
            entities: data.entities,
            tool_calls: data.tool_calls
          }, null, 2);

          chatStatus.textContent =
            "本轮完成，可以继续补充信息；新的问题可点击“新建会话”。";

        } catch (error) {
          addMessage(
            "assistant",
            "请求失败：" + error.message,
            true
          );

          // 方便修改后手动重试，不自动重复提交
          messageInput.value = message;
          chatStatus.textContent =
            "请检查错误信息。若是工单提交异常，先核查结果再重试。";

        } finally {
          setSending(false);
          messageInput.focus();
        }
      }
    );

    newChatButton.addEventListener("click", () => {
      if (sending) return;

      conversationId = null;
      messages.replaceChildren();
      messageInput.value = "";
      sessionLabel.textContent = "当前会话：尚未开始";
      debugOutput.textContent = "新会话尚无请求记录。";
      chatStatus.textContent = "已开始新会话，不会沿用上一段对话背景。";

      addMessage("assistant", "你好，请描述需要处理的 IT 问题。");
      messageInput.focus();
    });

    document.getElementById("ticket-form").addEventListener(
      "submit",
      async (event) => {
        event.preventDefault();

        const ticketId =
          document.getElementById("ticket-input").value.trim();
        const output = document.getElementById("ticket-output");
        const button = document.getElementById("ticket-button");

        if (!ticketId) return;

        button.disabled = true;
        output.textContent = "正在查询…";

        try {
          const data = await requestJson(
            "/tickets/" + encodeURIComponent(ticketId)
          );

          output.textContent = JSON.stringify(data, null, 2);

        } catch (error) {
          output.textContent = "查询失败：" + error.message;

        } finally {
          button.disabled = false;
        }
      }
    );

    addMessage("assistant", "你好，请描述需要处理的 IT 问题。");

      document.getElementById("status-form").addEventListener(
  "submit",
  async (event) => {
    event.preventDefault();

    const ticketId =
      document.getElementById("ticket-input").value.trim();

    const status =
      document.getElementById("status-select").value;

    const button =
      document.getElementById("status-button");

    const output =
      document.getElementById("status-output");

    if (!ticketId) {
      output.textContent = "请先在上方填写工单编号。";
      return;
    }

    button.disabled = true;
    output.textContent = "正在更新…";

    try {
      const data = await requestJson(
        "/tickets/" + encodeURIComponent(ticketId) + "/status",
        {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ status })
        }
      );

      output.textContent = JSON.stringify(data, null, 2);

      document.getElementById("ticket-output").textContent =
        "状态已提交更新，请点击上方“查询”获取最新完整记录。";

    } catch (error) {
      output.textContent = "更新失败：" + error.message;

    } finally {
      button.disabled = false;
    }
  }
);
  </script>
</body>
</html>
